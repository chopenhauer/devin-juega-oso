name: CI

# main only accepts commits whose `check` already passed on their branch, so pushing to main does
# not run CI again.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The whole branch against main, not just the last push: a cancelled run cannot hide code.
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then echo e2e=true >> "$GITHUB_OUTPUT"; exit 0; fi
          code=$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD \
            | grep -vE '\.md$|^docs/|^old-references/|^LICENSE$' || true)
          echo "$code"
          if [ -n "$code" ]; then echo e2e=true; else echo e2e=false; fi >> "$GITHUB_OUTPUT"

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The required check on main: everything passed, or the E2E were not needed (docs only).
  check:
    needs: [changes, unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
          NEEDS_E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          echo "changes=$CHANGES unit=$UNIT e2e=$E2E (needed: $NEEDS_E2E)"
          [ "$CHANGES" = success ] && [ "$UNIT" = success ] || exit 1
          [ "$E2E" = success ] || { [ "$E2E" = skipped ] && [ "$NEEDS_E2E" = false ]; }
