<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OSO</title>
<style>
:root{
  --bg:#f4efe6;
  --paper:#fffaf2;
  --paper-2:#f4eadc;
  --ink:#352418;
  --muted:#7d6a5c;
  --line:#d8c6b2;
  --dark:#4a2f1f;
  --p1:#2e7cf6;
  --p1-soft:#e8f2ff;
  --p2:#ef5a66;
  --p2-soft:#ffecee;
  --gold:#f4c34f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 0%,#fff 0,#fff8ef 32%,transparent 60%),
    linear-gradient(180deg,#eef5f8 0 10%,var(--bg) 10% 100%);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select{font:inherit}
button{touch-action:manipulation}
.app{width:min(100%,820px);padding:6px}
.panel{
  position:relative;
  overflow:hidden;
  border:1px solid #eadfce;
  border-radius:24px;
  background:rgba(255,250,242,.98);
  box-shadow:0 10px 34px rgba(87,61,37,.08);
  padding:7px;
}
.hidden{display:none!important}

/* SETUP */
.setup{display:grid;gap:14px;padding:8px}
.brand{
  text-align:center;
  font-size:44px;
  line-height:1;
  font-weight:1000;
  letter-spacing:.06em;
  color:var(--dark);
}
.tagline{text-align:center;color:var(--muted);font-size:14px;font-weight:700}
.players-setup{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pconfig{
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
  padding:10px;
}
.pconfig:nth-child(1){background:linear-gradient(180deg,#fff,var(--p1-soft))}
.pconfig:nth-child(2){background:linear-gradient(180deg,#fff,var(--p2-soft))}
.small-label{
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
}
.preview{
  width:62px;height:62px;
  margin:7px auto;
  display:grid;place-items:center;
  border:2px solid var(--line);
  border-radius:50%;
  background:#fff;
  font-size:38px;
}
.nickname{
  width:100%;min-height:44px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  font-size:17px;
  font-weight:900;
  text-align:center;
  padding:8px;
}
.avatars{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:4px;
  margin-top:8px;
}
.avatar-btn{
  aspect-ratio:1;
  min-width:0;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:20px;
  padding:0;
}
.avatar-btn.selected{
  border:2px solid var(--dark);
  background:#f2e6d6;
}
.setup-actions{
  display:flex;
  justify-content:center;
  align-items:end;
  gap:8px;
  flex-wrap:wrap;
}
select{
  min-height:44px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  font-size:16px;
  font-weight:900;
  padding:0 12px;
}
.primary{
  min-height:46px;
  border:0;
  border-radius:13px;
  background:var(--dark);
  color:#fff;
  padding:0 22px;
  font-size:16px;
  font-weight:950;
  box-shadow:0 4px 0 #2f1e14;
}

/* GAME LAYOUT */
.game{
  display:grid;
  gap:6px;
}
.player-panel{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
  border:2px solid transparent;
  border-radius:18px;
  padding:7px 8px;
  background:#fff;
}
.player-panel.p1{background:linear-gradient(90deg,var(--p1-soft),#fff)}
.player-panel.p2{background:linear-gradient(90deg,var(--p2-soft),#fff)}
.player-panel.p1.active{border-color:var(--p1)}
.player-panel.p2.active{border-color:var(--p2)}
.player-panel.top{transform:rotate(180deg)}

.identity{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:8px;
  align-items:center;
  min-width:0;
}
.avatar{
  width:42px;height:42px;
  border-radius:50%;
  background:#fff;
  border:2px solid var(--line);
  display:grid;place-items:center;
  font-size:27px;
}
.player-info{min-width:0}
.name{
  font-size:15px;
  line-height:1.05;
  font-weight:950;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.stats{
  display:flex;
  align-items:baseline;
  gap:8px;
  margin-top:3px;
}
.timer{
  font-size:20px;
  line-height:1;
  font-weight:1000;
  font-variant-numeric:tabular-nums;
}
.score-wrap{
  display:flex;
  align-items:baseline;
  gap:3px;
}
.score-label{font-size:10px;font-weight:900;color:var(--muted)}
.score{
  font-size:24px;
  line-height:1;
  font-weight:1000;
}
.p1 .timer,.p1 .score{color:var(--p1)}
.p2 .timer,.p2 .score{color:var(--p2)}

.tools{
  display:flex;
  align-items:center;
  gap:5px;
}
.power{
  width:44px;height:44px;
  position:relative;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  font-size:20px;
  padding:0;
  box-shadow:0 2px 0 rgba(90,63,38,.12);
}
.power .count{
  position:absolute;
  right:2px;top:2px;
  width:15px;height:15px;
  border-radius:50%;
  background:var(--dark);
  color:#fff;
  display:grid;place-items:center;
  font-size:9px;
  font-weight:900;
}
.power:disabled{opacity:.28}
.power.mode{
  outline:3px solid var(--gold);
  outline-offset:-2px;
  background:#fff6ce;
}

/* CENTRAL CONTROLS */
.center-controls{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  min-height:64px;
}
.turn-side{
  min-width:0;
  font-size:13px;
  font-weight:900;
  color:var(--muted);
}
.turn-side.left{text-align:left}
.turn-side.right{text-align:right}
.letter-choice{
  display:flex;
  gap:7px;
  padding:5px;
  border:1px solid var(--line);
  border-radius:17px;
  background:#eee4d6;
  box-shadow:inset 0 1px 0 #fff;
}
.letter{
  width:64px;
  height:54px;
  border:0;
  border-radius:13px;
  background:#fff7ed;
  color:var(--dark);
  font-size:29px;
  font-weight:1000;
  box-shadow:0 3px 0 #d6c6b3;
}
.letter.selected{
  background:var(--dark);
  color:#fff;
  box-shadow:0 3px 0 #27180f;
}
.letter:disabled{opacity:.55}

/* BOARD */
.board-shell{
  border:2px solid #c9b79e;
  border-radius:18px;
  background:#cdbda8;
  padding:4px;
}
.board{
  display:grid;
  gap:3px;
  width:100%;
}
.cell{
  position:relative;
  aspect-ratio:1;
  border:0;
  border-radius:9px;
  background:#fffaf2;
  display:grid;
  place-items:center;
  padding:0;
  overflow:hidden;
  color:var(--dark);
  font-size:clamp(24px,9.5vw,58px);
  font-weight:1000;
  box-shadow:
    inset 0 0 0 1px rgba(129,103,74,.16),
    0 1px 0 rgba(255,255,255,.55);
}
.cell span{position:relative;z-index:2}
.cell::after{
  content:"";
  position:absolute;
  inset:3px;
  border-radius:7px;
  opacity:0;
}
.cell.p1::after{background:color-mix(in srgb,var(--p1) 20%,transparent);opacity:1}
.cell.p2::after{background:color-mix(in srgb,var(--p2) 20%,transparent);opacity:1}
.cell.both::after{
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--p1) 22%,transparent) 0 48%,
    color-mix(in srgb,var(--p2) 22%,transparent) 52% 100%);
  opacity:1;
}
.cell.hint{outline:4px solid var(--gold);outline-offset:-4px}
.cell.last{box-shadow:inset 0 0 0 4px #4b3525}
.cell.swap-target{outline:3px dashed var(--gold);outline-offset:-4px}

.message{
  min-height:28px;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:14px;
  font-weight:950;
  color:var(--dark);
  padding:2px 8px;
}

/* SIDE MENU */
.menu-tab{
  position:absolute;
  top:47%;
  right:0;
  z-index:12;
  width:34px;height:64px;
  border:0;
  border-radius:13px 0 0 13px;
  background:var(--dark);
  color:#fff;
  font-size:21px;
}
.sidebar{
  position:absolute;
  right:0;
  top:34%;
  z-index:11;
  width:180px;
  border:1px solid var(--line);
  border-right:0;
  border-radius:17px 0 0 17px;
  background:#fffaf2;
  padding:10px;
  transform:translateX(100%);
  transition:transform .2s ease;
  box-shadow:-10px 10px 24px rgba(76,55,35,.12);
}
.sidebar.open{transform:translateX(0)}
.sidebar h3{margin:0 0 8px;font-size:15px}
.sidebar button{
  width:100%;
  min-height:42px;
  margin-top:6px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  color:var(--ink);
  font-size:13px;
  font-weight:900;
}

/* WINNER */
.winner-overlay{
  position:absolute;
  inset:0;
  z-index:20;
  display:grid;
  place-items:center;
  background:rgba(255,250,242,.96);
  text-align:center;
  padding:20px;
}
.winner-avatar{font-size:76px}
.winner-title{font-size:34px;font-weight:1000;letter-spacing:-.04em}
.winner-sub{font-size:16px;color:var(--muted);font-weight:800;margin-top:4px}
.winner-actions{display:flex;justify-content:center;gap:8px;margin-top:14px}
.secondary{
  min-height:44px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  color:var(--ink);
  padding:0 14px;
  font-size:13px;
  font-weight:900;
}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{
  position:absolute;
  top:-18px;
  width:9px;height:14px;
  border-radius:2px;
  animation:fall 2.7s linear forwards;
}
@keyframes fall{to{transform:translateY(780px) rotate(760deg)}}
.low{animation:pulse .7s infinite}
@keyframes pulse{50%{opacity:.35}}

/* MOBILE */
@media(max-width:600px){
  body{background:var(--bg)}
  .app{padding:2px}
  .panel{padding:4px;border-radius:14px;box-shadow:none}
  .game{gap:4px}
  .player-panel{
    grid-template-columns:minmax(0,1fr) auto;
    padding:5px 6px;
    border-radius:13px;
    gap:5px;
  }
  .avatar{width:36px;height:36px;font-size:23px}
  .name{font-size:14px}
  .timer{font-size:18px}
  .score{font-size:22px}
  .tools{gap:3px}
  .power{width:38px;height:38px;border-radius:10px;font-size:18px}
  .center-controls{min-height:58px;gap:4px}
  .turn-side{font-size:11px}
  .letter-choice{padding:4px;gap:5px;border-radius:14px}
  .letter{width:56px;height:48px;font-size:27px;border-radius:11px}
  .board-shell{padding:3px;border-radius:13px}
  .board{gap:2px}
  .cell{border-radius:6px}
  .message{font-size:13px;min-height:24px}
  .menu-tab{width:32px;height:58px}
  .sidebar{width:165px}
  .players-setup{gap:5px}
  .pconfig{padding:6px}
  .preview{width:48px;height:48px;font-size:30px}
  .avatars{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:390px){
  .player-panel{padding:4px}
  .avatar{width:32px;height:32px;font-size:20px}
  .name{font-size:12px}
  .timer{font-size:16px}
  .score{font-size:20px}
  .power{width:34px;height:34px;font-size:16px}
  .letter{width:50px;height:44px;font-size:25px}
  .turn-side{font-size:10px}
}
</style>
</head>
<body>
<main class="app">
<section class="panel">

<div id="setupScreen" class="setup">
  <div class="brand">OSO</div>
  <div class="tagline">Conecta · forma · gana</div>

  <div class="players-setup">
    <div class="pconfig">
      <div class="small-label">Jugador 1</div>
      <div id="preview1" class="preview">🐻</div>
      <input id="nickname1" class="nickname" value="Jugador 1" maxlength="16">
      <div class="avatars" data-player="0">
        <button class="avatar-btn selected" data-avatar="🐻">🐻</button><button class="avatar-btn" data-avatar="🐼">🐼</button>
        <button class="avatar-btn" data-avatar="🐻‍❄️">🐻‍❄️</button><button class="avatar-btn" data-avatar="🧸">🧸</button>
        <button class="avatar-btn" data-avatar="🦊">🦊</button><button class="avatar-btn" data-avatar="🐯">🐯</button>
        <button class="avatar-btn" data-avatar="🦁">🦁</button><button class="avatar-btn" data-avatar="🐸">🐸</button>
        <button class="avatar-btn" data-avatar="🐵">🐵</button><button class="avatar-btn" data-avatar="🐨">🐨</button>
        <button class="avatar-btn" data-avatar="🐧">🐧</button><button class="avatar-btn" data-avatar="🦄">🦄</button>
      </div>
    </div>

    <div class="pconfig">
      <div class="small-label">Jugador 2</div>
      <div id="preview2" class="preview">🐼</div>
      <input id="nickname2" class="nickname" value="Jugador 2" maxlength="16">
      <div class="avatars" data-player="1">
        <button class="avatar-btn" data-avatar="🐻">🐻</button><button class="avatar-btn selected" data-avatar="🐼">🐼</button>
        <button class="avatar-btn" data-avatar="🐻‍❄️">🐻‍❄️</button><button class="avatar-btn" data-avatar="🧸">🧸</button>
        <button class="avatar-btn" data-avatar="🦊">🦊</button><button class="avatar-btn" data-avatar="🐯">🐯</button>
        <button class="avatar-btn" data-avatar="🦁">🦁</button><button class="avatar-btn" data-avatar="🐸">🐸</button>
        <button class="avatar-btn" data-avatar="🐵">🐵</button><button class="avatar-btn" data-avatar="🐨">🐨</button>
        <button class="avatar-btn" data-avatar="🐧">🐧</button><button class="avatar-btn" data-avatar="🦄">🦄</button>
      </div>
    </div>
  </div>

  <div class="setup-actions">
    <div>
      <div class="small-label">Tablero</div>
      <select id="sizeSelect">
        <option value="4">4 × 4 · 1:30</option>
        <option value="5" selected>5 × 5 · 2:00</option>
        <option value="6">6 × 6 · 2:30</option>
        <option value="7">7 × 7 · 3:00</option>
        <option value="8">8 × 8 · 4:00</option>
      </select>
    </div>
    <button id="startGame" class="primary">Jugar</button>
  </div>
</div>

<div id="gameScreen" class="game hidden">

  <div id="side2" class="player-panel p2 top">
    <div class="identity">
      <div id="avatar2" class="avatar">🐼</div>
      <div class="player-info">
        <div id="name2" class="name">Jugador 2</div>
        <div class="stats"><span id="timer2" class="timer">2:00</span><span class="score-wrap"><span class="score-label">OSOS</span><span id="score2" class="score">0</span></span></div>
      </div>
    </div>
    <div class="tools">
      <button id="hint2" class="power" title="Pista">💡<span class="count">1</span></button>
      <button id="last2" class="power" title="Última jugada">👁️<span class="count">1</span></button>
      <button id="swap2" class="power" title="Cambiar una letra">🔄<span class="count">1</span></button>
    </div>
  </div>

  <div class="center-controls">
    <div id="turnLeft" class="turn-side left"></div>
    <div class="letter-choice">
      <button class="letter" data-letter="O">O</button>
      <button class="letter" data-letter="S">S</button>
    </div>
    <div id="turnRight" class="turn-side right"></div>
  </div>

  <div class="board-shell"><div id="board" class="board"></div></div>
  <div id="message" class="message" aria-live="polite"></div>

  <div id="side1" class="player-panel p1">
    <div class="identity">
      <div id="avatar1" class="avatar">🐻</div>
      <div class="player-info">
        <div id="name1" class="name">Jugador 1</div>
        <div class="stats"><span id="timer1" class="timer">2:00</span><span class="score-wrap"><span class="score-label">OSOS</span><span id="score1" class="score">0</span></span></div>
      </div>
    </div>
    <div class="tools">
      <button id="hint1" class="power" title="Pista">💡<span class="count">1</span></button>
      <button id="last1" class="power" title="Última jugada">👁️<span class="count">1</span></button>
      <button id="swap1" class="power" title="Cambiar una letra">🔄<span class="count">1</span></button>
    </div>
  </div>

  <button id="menuTab" class="menu-tab" aria-label="Abrir menú">☰</button>
  <aside id="sidebar" class="sidebar">
    <h3>Partida</h3>
    <button id="restartMatch">Reiniciar tablero</button>
    <button id="newGame">Nueva partida</button>
    <button id="closeMenu">Cerrar</button>
  </aside>
</div>

<div id="winnerOverlay" class="winner-overlay hidden">
  <div id="confetti" class="confetti"></div>
  <div>
    <div id="winnerAvatar" class="winner-avatar">🐻</div>
    <div id="winnerTitle" class="winner-title">¡Ganador!</div>
    <div id="winnerSub" class="winner-sub"></div>
    <div class="winner-actions">
      <button id="rematch" class="primary">Revancha</button>
      <button id="changePlayers" class="secondary">Cambiar jugadores</button>
    </div>
  </div>
</div>

</section>
</main>

<script>
(()=>{
const BONUS=10;
const timeFor=n=>Math.ceil((30+n*n*3)/30)*30;
const q=id=>document.getElementById(id);

const setup=q('setupScreen'),game=q('gameScreen'),boardEl=q('board'),msg=q('message');
const namesIn=[q('nickname1'),q('nickname2')],previews=[q('preview1'),q('preview2')];
const namesEl=[q('name1'),q('name2')],avatarsEl=[q('avatar1'),q('avatar2')];
const timers=[q('timer1'),q('timer2')],scoresEl=[q('score1'),q('score2')],sides=[q('side1'),q('side2')];
const hintBtns=[q('hint1'),q('hint2')],lastBtns=[q('last1'),q('last2')],swapBtns=[q('swap1'),q('swap2')];
const letterBtns=[...document.querySelectorAll('.letter')];

let avatars=['🐻','🐼'],names=['Jugador 1','Jugador 2'],size=5,board=[],current=0,scores=[0,0],times=[120,120];
let selected='O',scored=new Map(),history=[],extras=[],timer=null,lastTick=0,over=false,hintCell=null,lastCell=null,swapMode=null;

document.querySelectorAll('.avatars').forEach(grid=>{
  const p=+grid.dataset.player;
  grid.querySelectorAll('.avatar-btn').forEach(b=>b.addEventListener('click',()=>{
    grid.querySelectorAll('.avatar-btn').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    avatars[p]=b.dataset.avatar;
    previews[p].textContent=avatars[p];
  }));
});

letterBtns.forEach(b=>b.addEventListener('click',()=>{
  if(over)return;
  selected=b.dataset.letter;
  swapMode=null;
  updateControls();
  render();
}));

function fmt(v){
  v=Math.max(0,Math.ceil(v));
  return Math.floor(v/60)+':'+String(v%60).padStart(2,'0');
}
function updateTimers(){
  timers.forEach((e,i)=>{
    e.textContent=fmt(times[i]);
    e.classList.toggle('low',times[i]<=20&&!over);
  });
}
function updateControls(){
  sides.forEach((s,i)=>s.classList.toggle('active',i===current&&!over));
  letterBtns.forEach(b=>b.classList.toggle('selected',b.dataset.letter===selected));
  [0,1].forEach(i=>{
    hintBtns[i].disabled=i!==current||over||!extras[i].hint;
    lastBtns[i].disabled=i!==current||over||!extras[i].last||!history.some(m=>m.player!==i);
    swapBtns[i].disabled=i!==current||over||!extras[i].swap||!board.some(Boolean);
    swapBtns[i].classList.toggle('mode',swapMode===i);
  });

  const left=q('turnLeft'),right=q('turnRight');
  if(over){
    left.textContent='';
    right.textContent='';
  }else if(current===0){
    left.textContent=`${avatars[0]} ${names[0]}`;
    right.textContent='Tu turno';
  }else{
    left.textContent='Tu turno';
    right.textContent=`${avatars[1]} ${names[1]}`;
  }
}
function reset(){
  clearInterval(timer);
  board=Array(size*size).fill('');
  current=0;
  scores=[0,0];
  times=[timeFor(size),timeFor(size)];
  selected='O';
  scored=new Map();
  history=[];
  extras=[{hint:1,last:1,swap:1},{hint:1,last:1,swap:1}];
  over=false;
  hintCell=null;
  lastCell=null;
  swapMode=null;
  scoresEl.forEach(e=>e.textContent='0');
  q('winnerOverlay').classList.add('hidden');
  render();
  updateTimers();
  updateControls();
  msg.textContent=`${avatars[0]} ${names[0]} empieza.`;
  lastTick=performance.now();
  timer=setInterval(tick,100);
}
function tick(){
  if(over)return;
  const now=performance.now(),dt=(now-lastTick)/1000;
  lastTick=now;
  times[current]=Math.max(0,times[current]-dt);
  updateTimers();
  if(times[current]<=0)finish(1-current,'tiempo');
}
function render(){
  boardEl.innerHTML='';
  boardEl.style.gridTemplateColumns=`repeat(${size},minmax(0,1fr))`;
  board.forEach((v,i)=>{
    const c=document.createElement('button');
    c.type='button';
    c.className='cell';
    if(i===hintCell)c.classList.add('hint');
    if(i===lastCell)c.classList.add('last');
    if(swapMode===current&&v)c.classList.add('swap-target');
    const s=document.createElement('span');s.textContent=v;c.appendChild(s);
    c.addEventListener('click',()=>cellClick(i));
    boardEl.appendChild(c);
  });
  paint();
}
function paint(){
  const own=Array.from({length:size*size},()=>new Set());
  for(const [k,p] of scored.entries())k.split('-').map(Number).forEach(i=>own[i].add(p));
  [...boardEl.children].forEach((c,i)=>{
    if(own[i].size===2)c.classList.add('both');
    else if(own[i].has(0))c.classList.add('p1');
    else if(own[i].has(1))c.classList.add('p2');
  });
}
function cellClick(i){
  if(over)return;

  if(swapMode===current){
    if(!board[i]){
      msg.textContent='🔄 Elige una casilla ocupada.';
      return;
    }
    const p=current;
    extras[p].swap=0;
    board[i]=board[i]==='O'?'S':'O';
    history.push({player:p,index:i,letter:board[i],power:'swap'});
    swapMode=null;
    rebuildScores();
    hintCell=null;
    lastCell=null;
    msg.textContent=`🔄 ${names[p]} cambia la letra a ${board[i]}.`;
    current=1-current;
    lastTick=performance.now();
    render();
    updateControls();
    if(board.every(Boolean))endByScore();
    return;
  }

  if(board[i])return;
  const p=current;
  board[i]=selected;
  history.push({player:p,index:i,letter:selected});
  const made=findNew(i);
  made.forEach(k=>scored.set(k,p));

  if(made.length){
    scores[p]+=made.length;
    times[p]+=BONUS*made.length;
    scoresEl[p].textContent=scores[p];
    updateTimers();
    msg.textContent=`¡${avatars[p]} ${names[p]} consigue ${made.length===1?'un OSO':made.length+' OSO'}! +${BONUS*made.length}s`;
  }else{
    current=1-current;
    lastTick=performance.now();
    msg.textContent=`Turno de ${avatars[current]} ${names[current]}`;
  }

  hintCell=null;
  lastCell=null;
  render();
  updateControls();
  if(board.every(Boolean))endByScore();
}
function findNew(idx){
  const r0=Math.floor(idx/size),c0=idx%size,dirs=[[0,1],[1,0],[1,1],[1,-1]],found=[];
  for(const [dr,dc] of dirs){
    for(let off=-2;off<=0;off++){
      const cells=[];
      for(let k=0;k<3;k++){
        const r=r0+(off+k)*dr,c=c0+(off+k)*dc;
        if(r<0||c<0||r>=size||c>=size){cells.length=0;break}
        cells.push(r*size+c);
      }
      if(cells.length===3&&cells.includes(idx)&&board[cells[0]]==='O'&&board[cells[1]]==='S'&&board[cells[2]]==='O'){
        const key=cells.join('-');
        if(!scored.has(key)&&!found.includes(key))found.push(key);
      }
    }
  }
  return found;
}
function rebuildScores(){
  const previous=new Map(scored);
  scored=new Map();
  scores=[0,0];
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<size;r++)for(let c=0;c<size;c++)for(const [dr,dc] of dirs){
    const r2=r+2*dr,c2=c+2*dc;
    if(r2<0||c2<0||r2>=size||c2>=size)continue;
    const cells=[r*size+c,(r+dr)*size+(c+dc),r2*size+c2],key=cells.join('-');
    if(board[cells[0]]==='O'&&board[cells[1]]==='S'&&board[cells[2]]==='O'){
      const owner=previous.has(key)?previous.get(key):current;
      scored.set(key,owner);
      scores[owner]++;
    }
  }
  scoresEl.forEach((e,i)=>e.textContent=scores[i]);
}
function bestHint(){
  for(let i=0;i<board.length;i++){
    if(board[i])continue;
    for(const l of ['O','S']){
      board[i]=l;
      const n=findNew(i).length;
      board[i]='';
      if(n)return{index:i,letter:l};
    }
  }
  const empties=board.map((v,i)=>v?null:i).filter(v=>v!==null);
  if(!empties.length)return null;
  const center=(size*size-1)/2;
  empties.sort((a,b)=>Math.abs(a-center)-Math.abs(b-center));
  return{index:empties[0],letter:selected};
}

hintBtns.forEach((b,p)=>b.addEventListener('click',()=>{
  if(p!==current||!extras[p].hint)return;
  const h=bestHint();if(!h)return;
  extras[p].hint=0;
  selected=h.letter;
  hintCell=h.index;
  lastCell=null;
  swapMode=null;
  render();
  updateControls();
  msg.textContent=`💡 Prueba ${h.letter} en la casilla marcada.`;
}));
lastBtns.forEach((b,p)=>b.addEventListener('click',()=>{
  if(p!==current||!extras[p].last)return;
  const m=[...history].reverse().find(x=>x.player!==p);
  if(!m)return;
  extras[p].last=0;
  lastCell=m.index;
  hintCell=null;
  swapMode=null;
  render();
  updateControls();
  msg.textContent=`👁️ Última jugada rival: ${m.letter}.`;
}));
swapBtns.forEach((b,p)=>b.addEventListener('click',()=>{
  if(p!==current||!extras[p].swap)return;
  swapMode=swapMode===p?null:p;
  hintCell=null;
  lastCell=null;
  render();
  updateControls();
  msg.textContent=swapMode===p?'🔄 Elige una letra del tablero para cambiar O ↔ S.':'Cambio cancelado.';
}));

function endByScore(){
  if(scores[0]===scores[1])finish(null,'empate');
  else finish(scores[0]>scores[1]?0:1,'puntos');
}
function finish(w,reason){
  over=true;
  clearInterval(timer);
  updateControls();
  q('winnerOverlay').classList.remove('hidden');

  if(w===null){
    q('winnerAvatar').textContent='🤝';
    q('winnerTitle').textContent='¡Empate!';
    q('winnerSub').textContent=`${scores[0]} – ${scores[1]}`;
  }else{
    q('winnerAvatar').textContent=avatars[w];
    q('winnerTitle').textContent=`¡Gana ${names[w]}!`;
    q('winnerSub').textContent=reason==='tiempo'
      ?`El rival se quedó sin tiempo · ${scores[0]} – ${scores[1]}`
      :`Resultado final: ${scores[0]} – ${scores[1]}`;
    confetti();
  }
}
function confetti(){
  const h=q('confetti');
  h.innerHTML='';
  const cs=['#2e7cf6','#ef5a66','#f4c34f','#55a56d','#9b6bd6','#e88b45'];
  for(let i=0;i<90;i++){
    const x=document.createElement('i');
    x.style.left=Math.random()*100+'%';
    x.style.background=cs[i%cs.length];
    x.style.animationDelay=Math.random()+'s';
    h.appendChild(x);
  }
}

q('startGame').addEventListener('click',()=>{
  names=[namesIn[0].value.trim()||'Jugador 1',namesIn[1].value.trim()||'Jugador 2'];
  size=+q('sizeSelect').value;
  namesEl.forEach((e,i)=>e.textContent=names[i]);
  avatarsEl.forEach((e,i)=>e.textContent=avatars[i]);
  setup.classList.add('hidden');
  game.classList.remove('hidden');
  reset();
});
q('menuTab').addEventListener('click',()=>q('sidebar').classList.toggle('open'));
q('closeMenu').addEventListener('click',()=>q('sidebar').classList.remove('open'));
q('restartMatch').addEventListener('click',()=>{q('sidebar').classList.remove('open');reset()});
q('newGame').addEventListener('click',()=>{
  clearInterval(timer);
  q('sidebar').classList.remove('open');
  game.classList.add('hidden');
  setup.classList.remove('hidden');
});
q('rematch').addEventListener('click',reset);
q('changePlayers').addEventListener('click',()=>{
  q('winnerOverlay').classList.add('hidden');
  game.classList.add('hidden');
  setup.classList.remove('hidden');
});
})();
</script>
