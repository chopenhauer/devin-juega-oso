<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OSO</title>
<style>
  :root{--bg:#f2eee6;--paper:#fffdf8;--card:#f7f2e9;--ink:#20242b;--muted:#77716a;--line:#d8cfc1;--accent:#2a2520;--p1:#3567d6;--p2:#d65353;--gold:#e7b85c}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:flex;justify-content:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#faf7f1,var(--bg));overflow-x:hidden} button,input,select{font:inherit} button{touch-action:manipulation}.app{width:min(100%,860px);padding:10px 8px 22px;position:relative}.panel{background:rgba(255,253,248,.97);border:1px solid var(--line);border-radius:24px;padding:10px;box-shadow:0 12px 36px rgba(70,58,44,.08);position:relative;overflow:hidden}.hidden{display:none!important}
  .setup{display:grid;gap:12px}.intro{text-align:center}.intro h1{margin:0;font-size:40px;letter-spacing:-.06em}.intro p{margin:4px auto 0;max-width:580px;color:var(--muted);font-size:13px;line-height:1.45}.players-setup{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pconfig{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:9px;min-width:0}.label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.preview{width:56px;height:56px;margin:6px auto;display:grid;place-items:center;border-radius:17px;border:1px solid var(--line);font-size:34px;background:var(--paper)}.nickname{width:100%;min-height:42px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 9px;font-size:16px;font-weight:800;text-align:center;color:var(--ink)}.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:7px}.avatar-btn{min-width:0;aspect-ratio:1/1;border:1px solid var(--line);background:var(--paper);border-radius:10px;font-size:20px;cursor:pointer;display:grid;place-items:center}.avatar-btn.selected{border:2px solid var(--accent);background:#eee7dc}.setup-bottom{display:flex;gap:8px;justify-content:center;align-items:end;flex-wrap:wrap}select{appearance:none;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:11px 34px 11px 11px;font-weight:850}.start-btn{min-height:44px;border:0;border-radius:13px;background:var(--accent);color:#fff;padding:0 18px;font-weight:950;cursor:pointer}
  .table{display:grid;gap:7px}.player-zone{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--card);border:2px solid transparent;border-radius:16px;padding:7px;transition:.15s ease}.player-zone.active{background:#fff}.player-zone.p1.active{border-color:var(--p1)}.player-zone.p2.active{border-color:var(--p2)}.player-zone.top{transform:rotate(180deg)}.identity{display:flex;gap:7px;align-items:center;min-width:0}.mini-avatar{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:21px;background:var(--paper);flex:0 0 auto}.meta{min-width:0}.name{font-size:12px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer{font-size:14px;font-weight:950;font-variant-numeric:tabular-nums;color:var(--muted)}.score{font-size:27px;font-weight:950;line-height:1}.p1 .score,.p1.active .timer{color:var(--p1)}.p2 .score,.p2.active .timer{color:var(--p2)}
  .extras{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.extra-btn{min-width:40px;min-height:36px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px;cursor:pointer;padding:0 8px;font-weight:850;color:var(--ink)}.extra-btn:disabled{opacity:.35;cursor:default}.extra-count{font-size:9px;color:var(--muted);display:block;line-height:1}.center-strip{display:flex;align-items:center;justify-content:space-between;gap:6px}.turn-pill{font-size:10px;font-weight:900;color:var(--muted);text-align:center;min-width:90px}.letter-choice{display:flex;gap:4px;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--card);flex:1;max-width:220px}.letter{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--ink);font-size:22px;font-weight:950;cursor:pointer}.letter.selected{background:var(--accent);color:#fff}.secondary{min-height:40px;border:1px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink);padding:0 10px;font-size:11px;font-weight:850;cursor:pointer}
  .board-shell{background:#d8ccba;border:1px solid #c7b8a2;border-radius:16px;padding:4px}.board{display:grid;gap:3px;width:100%}.cell{position:relative;aspect-ratio:1/1;border:0;border-radius:8px;background:var(--paper);display:grid;place-items:center;padding:0;font-size:clamp(20px,8vw,50px);font-weight:950;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(120,105,84,.18);cursor:pointer;overflow:hidden}.cell span{position:relative;z-index:2}.cell::after{content:"";position:absolute;inset:2px;border-radius:6px;opacity:0;z-index:1}.cell.p1::after{background:color-mix(in srgb,var(--p1) 22%,transparent);opacity:1}.cell.p2::after{background:color-mix(in srgb,var(--p2) 22%,transparent);opacity:1}.cell.both::after{background:linear-gradient(135deg,color-mix(in srgb,var(--p1) 24%,transparent) 0 48%,color-mix(in srgb,var(--p2) 24%,transparent) 52% 100%);opacity:1}.cell.hint{outline:3px solid var(--gold);outline-offset:-3px}.cell.last{box-shadow:inset 0 0 0 3px #111}.message{text-align:center;min-height:24px;margin:4px 0 0;font-size:12px;font-weight:900}.rules{text-align:center;color:var(--muted);font-size:10px;line-height:1.35;margin-top:2px}
  .winner-overlay{position:absolute;inset:0;z-index:20;background:rgba(255,253,248,.94);display:grid;place-items:center;padding:20px;text-align:center}.winner-card{max-width:320px}.winner-avatar{font-size:68px;line-height:1}.winner-title{font-size:30px;font-weight:950;letter-spacing:-.04em;margin-top:6px}.winner-sub{color:var(--muted);font-size:14px;margin-top:4px}.winner-actions{display:flex;gap:8px;justify-content:center;margin-top:14px}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(720px) rotate(780deg)}}.low{animation:pulse .7s infinite}@keyframes pulse{50%{opacity:.35}}
  @media(max-width:600px){.app{padding:4px}.panel{padding:6px;border-radius:17px}.intro h1{font-size:34px}.players-setup{gap:5px}.pconfig{padding:6px;border-radius:14px}.preview{width:46px;height:46px;font-size:28px;border-radius:14px}.avatars{grid-template-columns:repeat(4,1fr)}.avatar-btn{font-size:18px}.table{gap:4px}.player-zone{padding:5px;border-radius:13px;gap:4px}.mini-avatar{width:28px;height:28px;font-size:17px;border-radius:8px}.name{font-size:10px}.timer{font-size:12px}.score{font-size:22px}.extra-btn{min-width:34px;min-height:32px;padding:0 5px;font-size:14px}.center-strip{gap:4px}.turn-pill{min-width:55px;font-size:8px}.letter{min-height:38px}.secondary{min-height:38px;padding:0 7px;font-size:10px}.board{gap:2px}.board-shell{padding:3px;border-radius:13px}.cell{border-radius:6px}.rules{display:none}}
</style>
</head>
<body>
<main class="app"><section class="panel">
<div id="setupScreen" class="setup">
  <div class="intro"><h1>OSO 🐻</h1><p>Dos jugadores frente a frente. Cada uno juega desde su lado de la mesa.</p></div>
  <div class="players-setup">
    <div class="pconfig"><div class="label">Jugador 1</div><div id="preview1" class="preview">🐻</div><input id="nickname1" class="nickname" maxlength="16" value="Jugador 1"><div class="avatars" data-player="0">
      <button type="button" class="avatar-btn selected" data-avatar="🐻">🐻</button><button type="button" class="avatar-btn" data-avatar="🐼">🐼</button><button type="button" class="avatar-btn" data-avatar="🐻‍❄️">🐻‍❄️</button><button type="button" class="avatar-btn" data-avatar="🧸">🧸</button><button type="button" class="avatar-btn" data-avatar="🦊">🦊</button><button type="button" class="avatar-btn" data-avatar="🐯">🐯</button><button type="button" class="avatar-btn" data-avatar="🦁">🦁</button><button type="button" class="avatar-btn" data-avatar="🐸">🐸</button><button type="button" class="avatar-btn" data-avatar="🐵">🐵</button><button type="button" class="avatar-btn" data-avatar="🐨">🐨</button><button type="button" class="avatar-btn" data-avatar="🐧">🐧</button><button type="button" class="avatar-btn" data-avatar="🦄">🦄</button>
    </div></div>
    <div class="pconfig"><div class="label">Jugador 2</div><div id="preview2" class="preview">🐼</div><input id="nickname2" class="nickname" maxlength="16" value="Jugador 2"><div class="avatars" data-player="1">
      <button type="button" class="avatar-btn" data-avatar="🐻">🐻</button><button type="button" class="avatar-btn selected" data-avatar="🐼">🐼</button><button type="button" class="avatar-btn" data-avatar="🐻‍❄️">🐻‍❄️</button><button type="button" class="avatar-btn" data-avatar="🧸">🧸</button><button type="button" class="avatar-btn" data-avatar="🦊">🦊</button><button type="button" class="avatar-btn" data-avatar="🐯">🐯</button><button type="button" class="avatar-btn" data-avatar="🦁">🦁</button><button type="button" class="avatar-btn" data-avatar="🐸">🐸</button><button type="button" class="avatar-btn" data-avatar="🐵">🐵</button><button type="button" class="avatar-btn" data-avatar="🐨">🐨</button><button type="button" class="avatar-btn" data-avatar="🐧">🐧</button><button type="button" class="avatar-btn" data-avatar="🦄">🦄</button>
    </div></div>
  </div>
  <div class="setup-bottom"><div><div class="label">Tablero</div><select id="setupSize"><option value="4">4 × 4 · 1:30</option><option value="5" selected>5 × 5 · 2:00</option><option value="6">6 × 6 · 2:30</option><option value="7">7 × 7 · 3:00</option><option value="8">8 × 8 · 4:00</option></select></div><button id="startGame" class="start-btn" type="button">Jugar</button></div>
</div>

<div id="gameScreen" class="hidden table">
  <div id="p2Zone" class="player-zone p2 top"><div class="identity"><div id="avatar2" class="mini-avatar">🐼</div><div class="meta"><div id="name2" class="name">Jugador 2</div><div><span id="timer2" class="timer">2:00</span> · <span id="score2" class="score">0</span></div></div></div><div class="extras"><button id="hint2" class="extra-btn" title="Pista">💡<span class="extra-count">1</span></button><button id="last2" class="extra-btn" title="Último movimiento rival">👁️<span class="extra-count">1</span></button><button id="swap2" class="extra-btn" title="Cambiar O/S">🔁<span class="extra-count">1</span></button></div></div>
  <div class="center-strip"><div id="turnLabel" class="turn-pill"></div><div class="letter-choice"><button type="button" class="letter selected" data-letter="O">O</button><button type="button" class="letter" data-letter="S">S</button></div><button id="newGame" class="secondary" type="button">Nueva partida</button></div>
  <div class="board-shell"><div id="board" class="board"></div></div>
  <div id="message" class="message" aria-live="polite"></div><div class="rules">💡 pista · 👁️ último movimiento del rival · 🔁 cambiar la letra elegida una vez</div>
  <div id="p1Zone" class="player-zone p1"><div class="identity"><div id="avatar1" class="mini-avatar">🐻</div><div class="meta"><div id="name1" class="name">Jugador 1</div><div><span id="timer1" class="timer">2:00</span> · <span id="score1" class="score">0</span></div></div></div><div class="extras"><button id="hint1" class="extra-btn" title="Pista">💡<span class="extra-count">1</span></button><button id="last1" class="extra-btn" title="Último movimiento rival">👁️<span class="extra-count">1</span></button><button id="swap1" class="extra-btn" title="Cambiar O/S">🔁<span class="extra-count">1</span></button></div></div>
</div>

<div id="winnerOverlay" class="winner-overlay hidden"><div class="confetti" id="confetti"></div><div class="winner-card"><div id="winnerAvatar" class="winner-avatar">🐻</div><div id="winnerTitle" class="winner-title">¡Ganador!</div><div id="winnerSub" class="winner-sub"></div><div class="winner-actions"><button id="playAgain" class="start-btn" type="button">Revancha</button><button id="backSetup" class="secondary" type="button">Cambiar jugadores</button></div></div></div>
</section></main>
<script>
(()=>{
const BONUS_TIME=10,timeForSize=n=>Math.ceil((30+n*n*3)/30)*30;
const setupScreen=document.getElementById('setupScreen'),gameScreen=document.getElementById('gameScreen'),winnerOverlay=document.getElementById('winnerOverlay'),boardEl=document.getElementById('board'),message=document.getElementById('message'),turnLabel=document.getElementById('turnLabel');
const nicknameInputs=[document.getElementById('nickname1'),document.getElementById('nickname2')],previews=[document.getElementById('preview1'),document.getElementById('preview2')],nameEls=[document.getElementById('name1'),document.getElementById('name2')],avatarEls=[document.getElementById('avatar1'),document.getElementById('avatar2')],timerEls=[document.getElementById('timer1'),document.getElementById('timer2')],scoreEls=[document.getElementById('score1'),document.getElementById('score2')],zones=[document.getElementById('p1Zone'),document.getElementById('p2Zone')],hintBtns=[document.getElementById('hint1'),document.getElementById('hint2')],lastBtns=[document.getElementById('last1'),document.getElementById('last2')],swapBtns=[document.getElementById('swap1'),document.getElementById('swap2')],letterBtns=[...document.querySelectorAll('.letter')];
let avatars=['🐻','🐼'],names=['Jugador 1','Jugador 2'],size=5,board=[],current=0,scores=[0,0],times=[120,120],selected='O',scored=new Map(),gameOver=false,timer=null,lastTick=0,moveHistory=[],extras=[{hint:1,last:1,swap:1},{hint:1,last:1,swap:1}],hintCell=null,lastCell=null;
document.querySelectorAll('.avatars').forEach(grid=>{const p=Number(grid.dataset.player);grid.querySelectorAll('.avatar-btn').forEach(btn=>btn.addEventListener('click',()=>{grid.querySelectorAll('.avatar-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');avatars[p]=btn.dataset.avatar;previews[p].textContent=avatars[p]}))});
letterBtns.forEach(btn=>btn.addEventListener('click',()=>{selected=btn.dataset.letter;letterBtns.forEach(b=>b.classList.toggle('selected',b===btn))}));
const fmt=v=>{const t=Math.max(0,Math.ceil(v));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function start(){names=[nicknameInputs[0].value.trim()||'Jugador 1',nicknameInputs[1].value.trim()||'Jugador 2'];size=Number(document.getElementById('setupSize').value);nameEls.forEach((e,i)=>e.textContent=names[i]);avatarEls.forEach((e,i)=>e.textContent=avatars[i]);setupScreen.classList.add('hidden');gameScreen.classList.remove('hidden');resetMatch()}
function resetMatch(){clearInterval(timer);board=Array(size*size).fill('');current=0;scores=[0,0];times=[timeForSize(size),timeForSize(size)];selected='O';scored=new Map();gameOver=false;moveHistory=[];extras=[{hint:1,last:1,swap:1},{hint:1,last:1,swap:1}];hintCell=null;lastCell=null;scoreEls.forEach(e=>e.textContent='0');letterBtns.forEach(b=>b.classList.toggle('selected',b.dataset.letter==='O'));updateExtras();updateTimers();render();setTurn();message.textContent=`${avatars[0]} ${names[0]} empieza.`;winnerOverlay.classList.add('hidden');lastTick=performance.now();timer=setInterval(tick,100)}
function tick(){if(gameOver)return;const now=performance.now(),dt=(now-lastTick)/1000;lastTick=now;times[current]=Math.max(0,times[current]-dt);updateTimers();if(times[current]<=0)finish(1-current,'tiempo')}
function updateTimers(){timerEls.forEach((e,i)=>{e.textContent=fmt(times[i]);e.classList.toggle('low',times[i]<=20&&!gameOver)})}
function setTurn(){zones.forEach((z,i)=>z.classList.toggle('active',i===current&&!gameOver));turnLabel.textContent=gameOver?'Partida terminada':`${avatars[current]} ${names[current]}`}
function updateExtras(){[0,1].forEach(i=>{hintBtns[i].disabled=extras[i].hint===0||i!==current||gameOver;lastBtns[i].disabled=extras[i].last===0||i!==current||gameOver||moveHistory.length===0;swapBtns[i].disabled=extras[i].swap===0||i!==current||gameOver})}
function render(){boardEl.innerHTML='';boardEl.style.gridTemplateColumns=`repeat(${size},minmax(0,1fr))`;board.forEach((v,i)=>{const c=document.createElement('button');c.type='button';c.className='cell'+(v?' filled':'');if(i===hintCell)c.classList.add('hint');if(i===lastCell)c.classList.add('last');const sp=document.createElement('span');sp.textContent=v;c.appendChild(sp);c.addEventListener('click',()=>play(i));boardEl.appendChild(c)});paintScored()}
function play(i){if(gameOver||board[i])return;hintCell=null;lastCell=null;board[i]=selected;moveHistory.push({player:current,index:i,letter:selected});const created=findNewOSOs(i);created.forEach(k=>scored.set(k,current));if(created.length){scores[current]+=created.length;times[current]+=BONUS_TIME*created.length;scoreEls[current].textContent=scores[current];updateTimers();message.textContent=`¡${avatars[current]} ${names[current]} consigue ${created.length===1?'un OSO':created.length+' OSO'}! +${BONUS_TIME*created.length}s`}else{current=1-current;lastTick=performance.now();message.textContent=`Turno de ${avatars[current]} ${names[current]}`}render();updateExtras();if(board.every(Boolean)){if(scores[0]===scores[1])finish(null,'empate');else finish(scores[0]>scores[1]?0:1,'puntos')}else setTurn()}
function findNewOSOs(index){const r0=Math.floor(index/size),c0=index%size,dirs=[[0,1],[1,0],[1,1],[1,-1]],found=[];for(const [dr,dc] of dirs){for(let off=-2;off<=0;off++){const cells=[];for(let k=0;k<3;k++){const r=r0+(off+k)*dr,c=c0+(off+k)*dc;if(r<0||c<0||r>=size||c>=size){cells.length=0;break}cells.push(r*size+c)}if(cells.length!==3||!cells.includes(index))continue;if(board[cells[0]]==='O'&&board[cells[1]]==='S'&&board[cells[2]]==='O'){const key=cells.join('-');if(!scored.has(key)&&!found.includes(key))found.push(key)}}}return found}
function paintScored(){const own=Array.from({length:size*size},()=>new Set());for(const [k,p] of scored.entries())k.split('-').map(Number).forEach(i=>own[i].add(p));[...boardEl.children].forEach((c,i)=>{if(own[i].size===2)c.classList.add('both');else if(own[i].has(0))c.classList.add('p1');else if(own[i].has(1))c.classList.add('p2')})}
function bestHint(){for(let i=0;i<board.length;i++){if(board[i])continue;for(const letter of ['O','S']){board[i]=letter;const n=findNewOSOs(i).length;board[i]='';if(n>0)return{index:i,letter}}}const center=(size*size-1)/2,empties=board.map((v,i)=>v?null:i).filter(v=>v!==null);empties.sort((a,b)=>Math.abs(a-center)-Math.abs(b-center));return empties.length?{index:empties[0],letter:selected}:null}
hintBtns.forEach((btn,p)=>btn.addEventListener('click',()=>{if(p!==current||extras[p].hint===0)return;const h=bestHint();if(!h)return;extras[p].hint=0;hintCell=h.index;lastCell=null;selected=h.letter;letterBtns.forEach(b=>b.classList.toggle('selected',b.dataset.letter===selected));render();updateExtras();message.textContent=`💡 Pista para ${names[p]}: prueba ${h.letter} en la casilla marcada.`}));
lastBtns.forEach((btn,p)=>btn.addEventListener('click',()=>{if(p!==current||extras[p].last===0||moveHistory.length===0)return;const lastOpp=[...moveHistory].reverse().find(m=>m.player!==p);if(!lastOpp)return;extras[p].last=0;lastCell=lastOpp.index;hintCell=null;render();updateExtras();message.textContent=`👁️ Última jugada rival: ${lastOpp.letter} en la casilla marcada.`}));
swapBtns.forEach((btn,p)=>btn.addEventListener('click',()=>{if(p!==current||extras[p].swap===0)return;extras[p].swap=0;selected=selected==='O'?'S':'O';letterBtns.forEach(b=>b.classList.toggle('selected',b.dataset.letter===selected));updateExtras();message.textContent=`🔁 ${names[p]} cambia a ${selected}.`}));
function finish(winner,reason){gameOver=true;clearInterval(timer);setTurn();updateExtras();winnerOverlay.classList.remove('hidden');const wa=document.getElementById('winnerAvatar'),wt=document.getElementById('winnerTitle'),ws=document.getElementById('winnerSub');if(winner===null){wa.textContent='🤝';wt.textContent='¡Empate!';ws.textContent=`${scores[0]} – ${scores[1]}`}else{wa.textContent=avatars[winner];wt.textContent=`¡Gana ${names[winner]}!`;ws.textContent=reason==='tiempo'?`El rival se quedó sin tiempo · ${scores[0]} – ${scores[1]}`:`Resultado final: ${scores[0]} – ${scores[1]}`;launchConfetti()}}
function launchConfetti(){const host=document.getElementById('confetti');host.innerHTML='';const colors=['#3567d6','#d65353','#e7b85c','#54a36c','#9b6bd6','#e68b45'];for(let i=0;i<90;i++){const el=document.createElement('i');el.style.left=(Math.random()*100)+'%';el.style.background=colors[i%colors.length];el.style.animationDelay=(Math.random()*1.1)+'s';el.style.transform=`rotate(${Math.random()*360}deg)`;host.appendChild(el)}}
document.getElementById('startGame').addEventListener('click',start);document.getElementById('newGame').addEventListener('click',()=>{clearInterval(timer);gameScreen.classList.add('hidden');setupScreen.classList.remove('hidden')});document.getElementById('playAgain').addEventListener('click',resetMatch);document.getElementById('backSetup').addEventListener('click',()=>{winnerOverlay.classList.add('hidden');gameScreen.classList.add('hidden');setupScreen.classList.remove('hidden')});
})();
</script>
</body></html>
